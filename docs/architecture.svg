<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img" aria-label="The frontend's main.ts asks four groups of rule and state modules and calls typed commands in api.ts; Tauri IPC carries them to lib.rs, where every path goes through the place.rs gate before reaching the engine (engine.rs and placement.rs), trash_ops::Trash, this computer's places-local crate, Drive, shares, SSH or Arbesk; placement uses the Trash (in places-local) for Replace and places-local's rename and platform.rs for renames that never replace.">
  <title>File Browser architecture</title>
  <style>
    svg { --bg:#f5f7fa; --ink:#1c2430; --muted:#5a6575; --line:#b7c0cd; --box:#ffffff;
      --panel-fe:#e9eff6; --panel-be:#f1eee8; --group:#dde6f0; --band:#e2e6ec;
      --accent:#1d6b88; --accent-soft:#d8eaf1;
      --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
      --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,"DejaVu Sans Mono",monospace;
      color:var(--ink); }
    @media (prefers-color-scheme: dark) {
      svg { --bg:#11151b; --ink:#e5eaf1; --muted:#98a4b4; --line:#4a5567; --box:#1b222c;
        --panel-fe:#172029; --panel-be:#201d1a; --group:#1e2935; --band:#191e26;
        --accent:#6cc2de; --accent-soft:#173342; }
    }
    .bg { fill:var(--bg); }
    .pfe { fill:var(--panel-fe); } .pbe { fill:var(--panel-be); } .band { fill:var(--band); } .grp { fill:var(--group); }
    .box { fill:var(--box); stroke:var(--line); stroke-width:1; }
    .deep { fill:var(--accent-soft); stroke:var(--accent); stroke-width:1.5; }
    .ext { fill:none; stroke:var(--line); stroke-width:1.3; stroke-dasharray:5 4; }
    .edge { fill:none; stroke:var(--ink); stroke-width:1.3; } .dash { stroke-dasharray:4 4; }
    .n { font:600 13px var(--mono); fill:var(--ink); }
    .s, .e { font:11px var(--sans); fill:var(--muted); }
    .g { font:600 10.5px var(--sans); letter-spacing:0.08em; fill:var(--muted); }
    .h { font:600 12px var(--sans); letter-spacing:0.06em; fill:var(--ink); }
    .tag { font:10px var(--mono); fill:var(--accent); }
    .row3 { font:12px var(--sans); fill:var(--ink); }
  </style>
  <rect class="bg" width="1200" height="720" rx="16"/>
        <defs>
          <marker id="ah" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
            <path d="M0,0 L8,4 L0,8 z" fill="currentColor"/>
          </marker>
        </defs>

        <!-- Panels -->
        <rect class="pfe" x="20" y="40" width="560" height="664" rx="14"/>
        <rect class="band" x="596" y="40" width="48" height="664" rx="8"/>
        <rect class="pbe" x="660" y="40" width="520" height="664" rx="14"/>
        <text class="h" x="40" y="66">FRONTEND · TypeScript in the webview</text>
        <text class="h" x="680" y="66">BACKEND · Rust</text>
        <text class="g" x="632" y="372" text-anchor="middle" transform="rotate(-90 632 372)">TAURI IPC · TYPED ASYNC COMMANDS</text>

        <!-- main.ts -->
        <rect class="box" x="40" y="84" width="520" height="56" rx="8"/>
        <text class="n" x="56" y="108">main.ts</text>
        <text class="s" x="56" y="127">wiring: DOM, events, views, menus, keys · asks the modules below, owns no rules</text>

        <!-- main.ts asks the four groups -->
        <polyline class="edge" points="300,140 300,160"/>
        <polyline class="edge" points="167,160 435,160"/>
        <line class="edge" x1="167" y1="160" x2="167" y2="179" marker-end="url(#ah)"/>
        <line class="edge" x1="435" y1="160" x2="435" y2="179" marker-end="url(#ah)"/>
        <polyline class="edge" points="302,160 302,426"/>
        <polyline class="edge" points="167,426 435,426"/>
        <line class="edge" x1="167" y1="426" x2="167" y2="443" marker-end="url(#ah)"/>
        <line class="edge" x1="435" y1="426" x2="435" y2="443" marker-end="url(#ah)"/>

        <!-- Group A: where am I, what may run -->
        <rect class="grp" x="40" y="180" width="255" height="230" rx="10"/>
        <text class="g" x="54" y="199">WHERE AM I · WHAT MAY RUN</text>
        <rect class="deep" x="56" y="212" width="180" height="32" rx="6"/>
        <text class="n" x="68" y="233">paths.ts</text>
        <text class="tag" x="244" y="232">#150</text>
        <line class="edge" x1="146" y1="244" x2="146" y2="261" marker-end="url(#ah)"/>
        <text class="e" x="154" y="257">placeOf</text>
        <rect class="deep" x="56" y="262" width="180" height="32" rx="6"/>
        <text class="n" x="68" y="283">locations.ts</text>
        <text class="tag" x="244" y="282">#168</text>
        <line class="edge" x1="146" y1="294" x2="146" y2="311" marker-end="url(#ah)"/>
        <text class="e" x="154" y="307">LocationKind</text>
        <rect class="deep" x="56" y="312" width="180" height="32" rx="6"/>
        <text class="n" x="68" y="333">item-actions.ts</text>
        <text class="tag" x="244" y="332">#168</text>
        <line class="edge" x1="146" y1="344" x2="146" y2="361" marker-end="url(#ah)"/>
        <text class="e" x="154" y="357">allows</text>
        <rect class="box" x="56" y="362" width="180" height="32" rx="6"/>
        <text class="n" x="68" y="383">preview-actions.ts</text>

        <!-- Group B: view state and stored paths -->
        <rect class="grp" x="310" y="180" width="250" height="230" rx="10"/>
        <text class="g" x="324" y="199">VIEW STATE · STORED PATHS</text>
        <rect class="box" x="326" y="210" width="180" height="30" rx="6"/>
        <text class="n" x="338" y="230">selection.ts</text>
        <rect class="deep" x="326" y="248" width="180" height="30" rx="6"/>
        <text class="n" x="338" y="268">search.ts</text>
        <text class="tag" x="514" y="267">#158</text>
        <rect class="deep" x="326" y="286" width="180" height="30" rx="6"/>
        <text class="n" x="338" y="306">folder-summaries.ts</text>
        <text class="tag" x="514" y="305">#156</text>
        <rect class="deep" x="326" y="324" width="180" height="30" rx="6"/>
        <text class="n" x="338" y="344">listing-failure.ts</text>
        <text class="tag" x="514" y="343">#156</text>
        <rect class="deep" x="326" y="362" width="180" height="30" rx="6"/>
        <text class="n" x="338" y="382">path-refs.ts</text>
        <text class="tag" x="514" y="381">#174</text>

        <!-- Group C: pictures -->
        <rect class="grp" x="40" y="444" width="255" height="186" rx="10"/>
        <text class="g" x="54" y="463">PICTURES</text>
        <rect class="deep" x="56" y="474" width="180" height="30" rx="6"/>
        <text class="n" x="68" y="494">item-icons.ts</text>
        <text class="tag" x="244" y="493">#162</text>
        <rect class="deep" x="56" y="512" width="180" height="30" rx="6"/>
        <text class="n" x="68" y="532">icons.ts · itemIcon</text>
        <text class="tag" x="244" y="531">#148</text>
        <rect class="box" x="56" y="550" width="180" height="30" rx="6"/>
        <text class="n" x="68" y="570">native-icons.ts</text>
        <rect class="box" x="56" y="588" width="180" height="30" rx="6"/>
        <text class="n" x="68" y="608">thumbnails.ts</text>

        <!-- Group D: widgets and dialogs -->
        <rect class="grp" x="310" y="444" width="250" height="96" rx="10"/>
        <text class="g" x="324" y="463">WIDGETS · DIALOGS</text>
        <rect class="deep" x="326" y="470" width="180" height="28" rx="6"/>
        <text class="n" x="338" y="489">ui.ts · busy dialogs</text>
        <text class="tag" x="514" y="488">#153</text>
        <rect class="box" x="326" y="504" width="226" height="28" rx="6"/>
        <text class="n" x="338" y="523">online-accounts.ts</text>
        <text class="s" x="482" y="522">providers.ts</text>

        <!-- main.ts calls commands through api.ts -->
        <polyline class="edge" points="560,112 572,112 572,550 435,550 435,559" marker-end="url(#ah)"/>
        <text class="e" x="428" y="557" text-anchor="end">invoke(command)</text>
        <rect class="box" x="310" y="560" width="250" height="44" rx="8"/>
        <text class="n" x="326" y="579">api.ts</text>
        <text class="s" x="326" y="596">one typed wrapper per command</text>
        <line class="edge dash" x1="435" y1="604" x2="435" y2="639" marker-end="url(#ah)"/>
        <text class="e" x="443" y="626">in tests</text>
        <rect class="ext" x="310" y="640" width="250" height="44" rx="8"/>
        <text class="n" x="326" y="659">dev/mock-tauri</text>
        <text class="s" x="326" y="676">the same commands, in memory</text>

        <!-- Across the IPC boundary -->
        <polyline class="edge" points="560,582 612,582 612,112 679,112" marker-end="url(#ah)"/>

        <!-- Backend -->
        <rect class="box" x="680" y="84" width="480" height="56" rx="8"/>
        <text class="n" x="696" y="108">lib.rs</text>
        <text class="s" x="696" y="127">thin commands · AppHandle · slow work on the blocking pool</text>
        <line class="edge" x1="920" y1="140" x2="920" y2="175" marker-end="url(#ah)"/>
        <text class="e" x="928" y="162">every path</text>

        <rect class="deep" x="680" y="176" width="480" height="50" rx="8"/>
        <text class="n" x="696" y="197">place.rs</text>
        <text class="tag" x="1148" y="197" text-anchor="end">#165 #182</text>
        <text class="s" x="696" y="215">the gate: kind · local path · writable · transfer (backend twin of placeOf)</text>

        <line class="edge" x1="785" y1="226" x2="785" y2="271" marker-end="url(#ah)"/>
        <text class="e" x="777" y="246" text-anchor="end">copy · move</text>
        <text class="e" x="777" y="259" text-anchor="end">download</text>
        <line class="edge" x1="1055" y1="226" x2="1055" y2="271" marker-end="url(#ah)"/>
        <text class="e" x="1063" y="246">trash · restore</text>
        <text class="e" x="1063" y="259">delete · empty</text>

        <rect class="deep" x="680" y="272" width="210" height="56" rx="8"/>
        <text class="n" x="696" y="293">engine.rs</text>
        <text class="tag" x="880" y="293" text-anchor="end">#146 #181</text>
        <text class="s" x="696" y="311">routes · placement.rs · Replace</text>

        <line class="edge" x1="890" y1="300" x2="949" y2="300" marker-end="url(#ah)"/>
        <text class="e" x="920" y="292" text-anchor="middle">send</text>
        <text class="e" x="920" y="315" text-anchor="middle">take back</text>

        <rect class="deep" x="950" y="272" width="210" height="56" rx="8"/>
        <text class="n" x="966" y="293">trash_ops::Trash</text>
        <text class="tag" x="1150" y="293" text-anchor="end">#161 #183</text>
        <text class="s" x="966" y="311">places-local · log · Put Back · untrash</text>

        <!-- place.rs to the readers -->
        <polyline class="edge" points="1160,201 1170,201 1170,352 723,352"/>
        <text class="e" x="690" y="346">list · count · open · read</text>
        <line class="edge" x1="723.5" y1="352" x2="723.5" y2="365" marker-end="url(#ah)"/>
        <line class="edge" x1="822.5" y1="352" x2="822.5" y2="365" marker-end="url(#ah)"/>
        <line class="edge" x1="920.5" y1="352" x2="920.5" y2="365" marker-end="url(#ah)"/>
        <line class="edge" x1="1018.5" y1="352" x2="1018.5" y2="365" marker-end="url(#ah)"/>
        <line class="edge" x1="1117.5" y1="352" x2="1117.5" y2="365" marker-end="url(#ah)"/>

        <rect class="box" x="680.0" y="366" width="86.4" height="44" rx="7"/>
        <text class="n" x="690.0" y="385">local</text>
        <text class="s" x="690.0" y="401">places-local</text>
        <rect class="box" x="778.4" y="366" width="86.4" height="44" rx="7"/>
        <text class="n" x="788.4" y="385">gdrive</text>
        <text class="s" x="788.4" y="401">Drive crate</text>
        <rect class="box" x="876.8" y="366" width="86.4" height="44" rx="7"/>
        <text class="n" x="886.8" y="385">share/</text>
        <text class="s" x="886.8" y="401">iroh shares</text>
        <rect class="box" x="975.2" y="366" width="86.4" height="44" rx="7"/>
        <text class="n" x="985.2" y="385">sftp</text>
        <text class="s" x="985.2" y="401">SSH crate</text>
        <rect class="box" x="1073.6" y="366" width="86.4" height="44" rx="7"/>
        <text class="n" x="1083.6" y="385">arbesk</text>
        <text class="s" x="1083.6" y="401">Arbesk crate</text>

        <rect class="box" x="680" y="424" width="480" height="34" rx="7"/>
        <text class="row3" x="696" y="446">versions/ · properties · thumbnails · file_icons · recent · config_store</text>

        <!-- the engine renames through places-local (transfer.rs, rename.rs, platform.rs) -->
        <polyline class="edge" points="680,300 670,300 670,521 679,521" marker-end="url(#ah)"/>
        <text class="e" x="690" y="486">rename that never replaces</text>

        <rect class="box" x="680" y="496" width="480" height="50" rx="8"/>
        <text class="n" x="696" y="517">places-local: transfer.rs · rename.rs · platform.rs</text>
        <text class="s" x="696" y="535">rename_new · rename_exclusive · XDG paths · volumes</text>

        <line class="edge" x1="920" y1="546" x2="920" y2="589" marker-end="url(#ah)"/>
        <text class="e" x="928" y="572">renameat2 · renamex_np</text>

        <rect class="ext" x="680" y="590" width="480" height="50" rx="8"/>
        <text class="n" x="696" y="611">the operating system</text>
        <text class="s" x="696" y="629">files · Trash (Finder ~/.Trash · freedesktop Trash/) · Drive · iroh · SSH · Arbesk</text>
      </svg>
