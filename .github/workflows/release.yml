# Build File Browser for macOS and Linux.
#
# - Push a tag like `v0.4.0`: builds both platforms and creates a *draft*
#   GitHub Release with the packages attached. Review it, then publish.
# - Run manually (Actions → Release → Run workflow), or open a pull request
#   that changes this file: builds the same packages as downloadable workflow
#   artifacts, without creating a release.
#
# Nothing secret is needed: Google Drive users bring their own OAuth client
# (docs/google-drive.md). macOS builds are ad-hoc signed, not notarized.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    paths: [".github/workflows/release.yml"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            # One app for Apple Silicon and Intel Macs.
            args: --target universal-apple-darwin --bundles app,dmg
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ""
            rust-targets: ""
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libssl-dev libxdo-dev librsvg2-dev libayatana-appindicator3-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # package-lock.json is git-ignored on purpose (see AGENTS.md).
      - name: Install npm packages
        run: npm install --package-lock=false

      - name: Build (and draft a release for tags)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}
          # Empty unless a tag was pushed: build only, no release.
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: File Browser ${{ github.ref_name }}
          releaseBody: |
            See the README for what's new and how to install.

            **macOS:** the app isn't notarized. After copying it to Applications, run
            `xattr -dr com.apple.quarantine "/Applications/File Browser.app"` once,
            or right-click it and choose Open.

            **Google Drive:** follow docs/google-drive.md to add your own OAuth client.
          releaseDraft: true
          prerelease: false

      - name: Keep the packages (manual and pull request runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: file-browser-${{ matrix.platform }}
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
