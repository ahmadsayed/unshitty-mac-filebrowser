# Build File Browser for macOS and Linux.
#
# - Push a tag like `v0.4.0`: checks that the tag matches the app version,
#   runs the tests, builds both platforms and creates a *draft* GitHub
#   Release with the packages attached. Review it, then publish.
# - Run manually (Actions → Release → Run workflow), or open a pull request
#   that changes this file: tests and builds the same packages as
#   downloadable workflow artifacts, without creating a release, even when
#   a manual run is started on a tag.
#
# Only the release job can write to the repository, and it runs only for a
# pushed tag. Actions are pinned to commits; the comment names the version.
#
# Secrets: TAURI_SIGNING_PRIVATE_KEY and its _PASSWORD sign the packages
# Check for Updates installs (HUMANS.md). Only the sign job sees them: it
# runs after the builds, for a pushed tag, with nothing but the runner,
# Ubuntu's minisign and scripts/sign-updater.sh. The build jobs, which run
# npm packages and every crate's build scripts, never get the key, so a
# compromised dependency can't sign a malicious update. The sign job uses
# the `release` environment, which can hold the secrets and require your
# approval (HUMANS.md). Without the secrets a tag push fails at signing
# rather than draft a release no installed copy could update from; other
# runs build unsigned. Google Drive users bring their own OAuth client
# (docs/google-drive.md). macOS builds are ad-hoc signed, not notarized.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    paths: [".github/workflows/release.yml"]

permissions:
  contents: read

jobs:
  # The Rust dependencies of the app and of the phone page, against deny.toml:
  # RustSec advisories (vulnerable, unsound, unmaintained, yanked), licences
  # compatible with GPL-3.0-or-later, crates.io as the only source. A new
  # advisory blocks the release until it is fixed or ignored with a reason
  # (AGENTS.md). Release time only: there is no CI on pull requests.
  rust-deps:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Install cargo-deny
        run: cargo install --locked cargo-deny@0.20.2

      - name: Check the Rust dependencies
        run: |
          for manifest in src-tauri/Cargo.toml web/file-get/Cargo.toml; do
            cargo deny --locked --manifest-path "$manifest" --config deny.toml check
          done

  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check the tag matches the app version
        if: github.event_name == 'push'
        run: |
          for version in \
            "$(jq -r .version src-tauri/tauri.conf.json)" \
            "$(jq -r .version package.json)" \
            "$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml)"; do
            if [ "v$version" != "$GITHUB_REF_NAME" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match version $version in tauri.conf.json, package.json or Cargo.toml."
              exit 1
            fi
          done

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libssl-dev libxdo-dev librsvg2-dev libayatana-appindicator3-dev

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          # No npm cache in a release build: npm ci fetches the locked, checked
          # tarballs fresh. (setup-node turns a cache on by itself once
          # package.json names npm as its packageManager.)
          package-manager-cache: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      # A tag build starts clean: nothing an earlier run cached (or poisoned)
      # reaches a release, and older caches may hold the signing key, which
      # a build script wrote into target/ while it was still in the build
      # environment (RUSTSEC-2026-0418).
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        if: github.event_name != 'push'
        with:
          workspaces: src-tauri

      # Exactly the committed package-lock.json, all from the public registry
      # (scripts/check-lockfile.mjs), each tarball checked against its sha512.
      # No install scripts: none of these packages needs one on Linux or
      # macOS (fsevents ships prebuilt).
      - name: Check package-lock.json
        run: node scripts/check-lockfile.mjs

      - name: Install npm packages
        run: npm ci --ignore-scripts --no-fund

      # The registry's signatures (and provenance, where published) for every
      # installed package, and known vulnerabilities in what ships in the app.
      - name: Verify npm signatures and audit
        run: |
          npm audit signatures
          npm audit --omit=dev --audit-level=high

      - name: Type-check and build the frontend
        run: |
          npx tsc --noEmit
          npm run build

      - name: Frontend tests
        run: npm test

      - name: Backend tests
        working-directory: src-tauri
        run: cargo test --locked

  build:
    needs: [check, rust-deps]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            # Apple Silicon only: one compile instead of two (no Intel Macs).
            args: --target aarch64-apple-darwin --bundles app,dmg
            rust-targets: aarch64-apple-darwin
          - platform: ubuntu-22.04
            args: ""
            rust-targets: ""
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libssl-dev libxdo-dev librsvg2-dev libayatana-appindicator3-dev patchelf

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          # No npm cache in a release build: npm ci fetches the locked, checked
          # tarballs fresh. (setup-node turns a cache on by itself once
          # package.json names npm as its packageManager.)
          package-manager-cache: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.rust-targets }}

      # A tag build starts clean: nothing an earlier run cached (or poisoned)
      # reaches a release, and older caches may hold the signing key, which
      # a build script wrote into target/ while it was still in the build
      # environment (RUSTSEC-2026-0418).
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        if: github.event_name != 'push'
        with:
          workspaces: src-tauri

      - name: Check package-lock.json
        run: node scripts/check-lockfile.mjs

      - name: Install npm packages
        run: npm ci --ignore-scripts --no-fund

      # No signing key here: this job runs npm packages and build scripts.
      # The sign job signs the updater packages afterwards.
      - name: Build
        run: npm run tauri build -- ${{ matrix.args }}

      # What Check for Updates installs on a Mac: the app in a .tar.gz, the
      # app folder at its top, as Tauri's own updater bundle has it (the
      # updater drops each entry's first path component). COPYFILE_DISABLE
      # keeps macOS tar from adding ._ files, which would break the app's
      # code signature.
      - name: Pack the app for Check for Updates
        if: runner.os == 'macOS'
        working-directory: src-tauri/target/aarch64-apple-darwin/release/bundle/macos
        run: COPYFILE_DISABLE=1 tar -czf "File Browser.app.tar.gz" "File Browser.app"

      - name: Keep the packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: file-browser-${{ matrix.platform }}
          path: |
            src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

      - name: Keep the updater package
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: file-browser-updater-${{ matrix.platform }}
          path: src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz
          if-no-files-found: error

  # The only job with the signing key. It runs no npm package, no build
  # script and no cache: the runner image, Ubuntu's minisign package and
  # scripts/sign-updater.sh, which verifies each signature against the
  # app's public key before anything is released.
  sign:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: file-browser-*
          path: packages
          merge-multiple: true

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: source
          persist-credentials: false
          sparse-checkout: |
            scripts/sign-updater.sh
            src-tauri/tauri.conf.json
          sparse-checkout-cone-mode: false

      - name: Install minisign
        run: |
          sudo apt-get update
          sudo apt-get install -y minisign

      # The check job made sure the tag is v<version of the app>.
      - name: Sign the updater packages
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          pubkey=$(jq -r .plugins.updater.pubkey source/src-tauri/tauri.conf.json)
          mapfile -d '' packages < <(find packages -type f \( -name '*.AppImage' -o -name '*.app.tar.gz' \) -print0)
          bash source/scripts/sign-updater.sh "${GITHUB_REF_NAME#v}" "$pubkey" "${packages[@]}"

      # Paths relative to packages/, so each .sig lands next to its package
      # when the release job downloads everything into one folder.
      - name: Keep the signatures
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: file-browser-signatures
          path: packages/**/*.sig
          if-no-files-found: error

  release:
    # A pushed tag only: a manual run on a tag ref builds but never releases.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: [build, sign]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: packages
          merge-multiple: true

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: source
          sparse-checkout: |
            scripts
            package.json
          sparse-checkout-cone-mode: false

      # Check for Updates reads this from the newest published release. A tag
      # push publishes a release users update from, so there it must be signed.
      - name: Write latest.json
        working-directory: source
        run: node scripts/updater-manifest.mjs ${{ github.ref_type == 'tag' && '--require-signed' || '' }} ../packages ../packages/latest.json

      - name: Draft the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTES: |
            See the README for what's new and how to install.

            **macOS:** the app isn't notarized. After copying it to Applications, run
            `xattr -dr com.apple.quarantine "/Applications/File Browser.app"` once,
            or right-click it and choose Open.

            **Linux:** use the `.deb`, `.rpm` or portable AppImage. For the AppImage
            and GNOME application search, follow docs/linux-appimage.md or run:

            ```sh
            chmod +x install-linux-appimage.sh
            ./install-linux-appimage.sh ./File.Browser_<version>_amd64.AppImage
            ```

            **Google Drive:** follow docs/google-drive.md to add your own OAuth client.
        run: |
          mapfile -d '' assets < <(find packages -type f -print0)
          gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "File Browser $GITHUB_REF_NAME" --notes "$NOTES"
