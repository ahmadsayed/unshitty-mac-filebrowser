# Dependabot: weekly update PRs for npm, the src-tauri Cargo workspace
# (crates/arbesk included) and the phone page's Cargo project, plus the
# workflows' actions (kept pinned to commit SHAs). Nothing merges by itself:
# each PR waits for the human, like any other (HUMANS.md).
#
# Cooldown: a version is offered only once it has been public for 7 days
# (30 for a new major), so a hijacked release, usually caught and pulled
# within days, doesn't reach this repository. Security updates skip the
# cooldown and arrive at once.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      semver-major-days: 30
    open-pull-requests-limit: 5
    groups:
      # Keep the JS side of Tauri on the same minor as the Rust crates.
      tauri:
        patterns: ["@tauri-apps/*"]
      build-tools:
        patterns: ["vite", "vitest", "@vitest/*", "typescript", "jsdom"]

  - package-ecosystem: cargo
    directories:
      - /src-tauri
      - /web/file-get
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      semver-major-days: 30
    open-pull-requests-limit: 5
    ignore:
      # bao-tree's types are part of iroh-blobs' API (ChunkRanges in
      # share/guest.rs), so it must stay on the version iroh-blobs uses: a
      # bump on its own (#109, 0.16 -> 0.17) doesn't compile. In 0.x a minor
      # is a breaking release; move it by hand with iroh-blobs.
      - dependency-name: bao-tree
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      # gio and gtk are the gtk-rs crates Tauri's GTK3 stack is built on
      # (0.18); on their own they pull in a second set of GLib bindings, and
      # gio 0.22 (#117) moved DesktopAppInfo out, breaking the Linux build.
      # They move by hand when Tauri does.
      - dependency-name: gio
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: gtk
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
    groups:
      tauri:
        patterns: ["tauri", "tauri-*"]
      iroh:
        patterns: ["iroh", "iroh-*", "n0-*", "bao-tree"]
      # Everything else that isn't a new major, in one weekly PR.
      minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      # Minor and patch bumps together; a new major (which can change the
      # Node runtime an action needs) gets a PR of its own.
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
