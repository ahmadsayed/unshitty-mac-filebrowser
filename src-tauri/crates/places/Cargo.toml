[package]
name = "places"
version = "0.1.0"
description = "One interface for every place File Browser shows: the provider traits and the types and helpers they share"
authors = ["you"]
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
# `raw_value`: a provider's own record handed on unchanged (`Json`); the
# app's Tauri already turns it on.
serde_json = { version = "1", features = ["raw_value"] }

[dev-dependencies]
tempfile = "3"
