[package]
name = "places-sftp"
version = "0.1.0"
description = "SSH servers for File Browser: read-only SFTP connections, listing and downloads, as a places provider"
authors = ["you"]
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[dependencies]
places = { version = "0.1.0", path = "../places" }
serde = { version = "1", features = ["derive"] }
percent-encoding = "2"
url = "2"
data-encoding = "2"

[target.'cfg(target_os = "linux")'.dependencies]
ssh2 = "0.9"

[target.'cfg(target_os = "macos")'.dependencies]
ssh2 = { version = "0.9", features = ["vendored-openssl"] }

[dev-dependencies]
tempfile = "3"
