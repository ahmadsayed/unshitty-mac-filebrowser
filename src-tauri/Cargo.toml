[package]
name = "filebrowser"
version = "0.6.0"
description = "A GNOME Files-style file browser for macOS and Linux"
authors = ["you"]
edition = "2024"
license = "GPL-3.0-or-later"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "filebrowser_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-drag = "2.1.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
plist = "1"
percent-encoding = "2"
oauth2 = { version = "5", features = ["reqwest-blocking"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
keyring = "4"
url = "2"
getrandom = "0.3"
chrono = "0.4"
trash = "5"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled", "backup"] }
zstd = "0.14.3"
zip = { version = "2", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1"
bzip2 = "0.5"
xz2 = "0.1"
blake3 = "1.8.7"
notify = "8.2.0"
similar = "3.2.0"
iroh = "1"
iroh-blobs = { version = "0.103", default-features = false, features = ["fs-store"] }
bao-tree = "0.16"
n0-future = "0.3"
postcard = { version = "1", features = ["use-std"] }
data-encoding = "2"
argon2 = { version = "0.5", default-features = false, features = ["alloc", "zeroize"] }
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
zeroize = "1"
tokio = { version = "1", features = ["sync", "rt", "time"] }
unicode-normalization = "0.1.26"


[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target.'cfg(target_os = "linux")'.dependencies]
ssh2 = "0.9"
# Already linked through Tauri; used for the icon theme and file icons.
gio = "0.18"
gtk = "0.18"

[target.'cfg(target_os = "macos")'.dependencies]
xattr = "1"
# Already linked through Tauri; used to draw Finder's file icons.
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSData", "NSDictionary", "NSGeometry"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSWorkspace", "NSImage", "NSImageRep", "NSBitmapImageRep", "NSGraphicsContext", "NSGraphics", "objc2-core-foundation"] }
ssh2 = { version = "0.9", features = ["vendored-openssl"] }
