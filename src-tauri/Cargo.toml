[workspace]
members = ["crates/arbesk", "crates/places", "crates/places-gdrive", "crates/places-local", "crates/places-sftp"]
# `cargo test` from src-tauri keeps covering the app and its crates.
default-members = [".", "crates/arbesk", "crates/places", "crates/places-gdrive", "crates/places-local", "crates/places-sftp"]
resolver = "3"

[package]
name = "filebrowser"
version = "0.8.2"
description = "A GNOME Files-style file browser for macOS and Linux"
authors = ["you"]
edition = "2024"
license = "GPL-3.0-or-later"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "filebrowser_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
arbesk = { version = "0.1.0", path = "crates/arbesk" }
places = { version = "0.1.0", path = "crates/places" }
places-gdrive = { version = "0.1.0", path = "crates/places-gdrive" }
places-local = { version = "0.1.0", path = "crates/places-local" }
places-sftp = { version = "0.1.0", path = "crates/places-sftp" }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-drag = "2.1.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
plist = "1"
percent-encoding = "2"
url = "2"
getrandom = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
# The text a desktop thumbnail carries (Thumb::URI, Thumb::MTime), read without decoding it.
png = "0.18"
# Names in the desktop's shared thumbnail cache are the MD5 of the file's URI.
md-5 = "0.10"
rusqlite = { version = "0.41.0", default-features = false, features = ["bundled", "backup"] }
zstd = "0.14.3"
zip = { version = "9", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1"
brotli = "9"
bzip2 = "0.6"
xz2 = { version = "0.1", features = ["static"] }
blake3 = "1.8.7"
notify = "8.2.0"
similar = "3.2.0"
# iroh without "portmapper": sharing never asks the router to forward a port
# (UPnP, NAT-PMP, PCP). Peers behind strict NATs go through the relay instead.
iroh = { version = "1", default-features = false, features = ["metrics", "fast-apple-datapath", "tls-ring"] }
iroh-blobs = { version = "0.103", default-features = false, features = ["fs-store"] }
bao-tree = "0.16"
n0-future = "0.3"
postcard = { version = "1", features = ["use-std"] }
data-encoding = "2"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
argon2 = { version = "0.6", default-features = false, features = ["alloc", "zeroize"] }
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc"] }
zeroize = "1"
tokio = { version = "1", features = ["sync", "rt", "time"] }


[dev-dependencies]
tempfile = "3"
# Drive's fake server and test context, for the engine's tests.
places-gdrive = { version = "0.1.0", path = "crates/places-gdrive", features = ["testing"] }
# The Trash fixtures, for the tests of Replace through the logged Trash.
places-local = { version = "0.1.0", path = "crates/places-local", features = ["testing"] }
# tests/release_signing.rs checks release signatures as tauri-plugin-updater
# does; both are already in Cargo.lock through tauri.
base64 = "0.23"
minisign-verify = "0.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target.'cfg(target_os = "linux")'.dependencies]
# Already linked through Tauri; used for the icon theme and file icons.
gio = "0.18"
gtk = "0.18"

[target.'cfg(target_os = "macos")'.dependencies]
xattr = "1"
# Already linked through Tauri; used to draw Finder's file icons.
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSData", "NSDictionary", "NSGeometry", "NSURL", "NSArray"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSWorkspace", "NSImage", "NSImageRep", "NSBitmapImageRep", "NSGraphicsContext", "NSGraphics", "objc2-core-foundation"] }
