[package]
name = "file-get"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "The page a phone opens from a QR code: downloads one shared file over iroh"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
iroh = { version = "1.4", default-features = false, features = ["tls-ring"] }
blake3 = "1"
data-encoding = "2"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
