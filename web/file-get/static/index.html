<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>File Browser: Shared Files</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; box-sizing: border-box;
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Cantarell, sans-serif; background: #fafafb; color: rgba(0, 0, 6, 0.8); }
  @media (prefers-color-scheme: dark) { body { background: #222226; color: #fff; } a { color: #78aeed; } }
  main { max-width: 420px; text-align: center; }
</style>
</head>
<body>
<main>
  <h1>Shared Files</h1>
  <p>This site downloads files shared from
    <a href="https://github.com/ahmadsayed/unshitty-mac-filebrowser">File Browser</a> with a QR code.
    Scan the code on the computer sharing a file to open its download page.</p>
</main>
</body>
</html>
