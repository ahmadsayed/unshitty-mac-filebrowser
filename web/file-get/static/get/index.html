<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>Shared File</title>
<style>
  :root {
    --bg: #fafafb; --card: #ffffff; --fg: rgba(0, 0, 6, 0.8); --dim: rgba(0, 0, 6, 0.55);
    --border: rgba(0, 0, 6, 0.1); --accent: #3584e4; --accent-fg: #ffffff; --button: rgba(0, 0, 6, 0.08);
    --error: #c01c28; --track: rgba(0, 0, 6, 0.1);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #222226; --card: #2e2e32; --fg: #ffffff; --dim: rgba(255, 255, 255, 0.6);
      --border: rgba(255, 255, 255, 0.1); --accent: #3584e4; --button: rgba(255, 255, 255, 0.1);
      --error: #ff7b63; --track: rgba(255, 255, 255, 0.15);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 16px; padding: 24px 16px; background: var(--bg); color: var(--fg);
    font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Cantarell, sans-serif;
  }
  main {
    width: 100%; max-width: 380px; background: var(--card); border: 1px solid var(--border); border-radius: 16px;
    padding: 28px 24px 24px; display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center;
  }
  .icon { width: 72px; height: 72px; color: var(--accent); }
  h1 { margin: 4px 0 0; font-size: 19px; font-weight: 700; overflow-wrap: anywhere; }
  .dim { color: var(--dim); margin: 0; }
  #status { margin: 6px 0 2px; min-height: 1.4em; }
  #status.error { color: var(--error); }
  .bar { width: 100%; height: 6px; border-radius: 3px; background: var(--track); overflow: hidden; }
  .bar > div { height: 100%; width: 0; background: var(--accent); transition: width 0.15s; }
  .buttons { display: flex; flex-direction: column; gap: 8px; width: 100%; margin-top: 6px; }
  button {
    font: inherit; font-weight: 700; border: 0; border-radius: 10px; padding: 12px 16px; width: 100%;
    background: var(--button); color: var(--fg); cursor: pointer;
  }
  button.suggested { background: var(--accent); color: var(--accent-fg); }
  button[hidden], .bar[hidden] { display: none; }
  footer { max-width: 380px; font-size: 13px; color: var(--dim); text-align: center; }
  footer a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <svg class="icon" viewBox="0 0 64 64" aria-hidden="true">
    <path fill="currentColor" opacity=".18" d="M16 6h22l14 14v36a4 4 0 0 1-4 4H16a4 4 0 0 1-4-4V10a4 4 0 0 1 4-4z"/>
    <path fill="currentColor" d="M38 6v10a4 4 0 0 0 4 4h10z"/>
    <path fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" d="M32 30v16m-7-7 7 7 7-7"/>
  </svg>
  <h1 id="name">Shared File</h1>
  <p id="size" class="dim"></p>
  <div id="bar" class="bar" hidden><div id="fill"></div></div>
  <p id="status">Loading…</p>
  <div class="buttons">
    <button id="start" class="suggested" hidden>Download</button>
    <button id="save" class="suggested" hidden>Save File</button>
    <button id="share" hidden>Share…</button>
    <button id="retry" hidden>Try Again</button>
  </div>
</main>
<footer>
  The file comes straight from the computer sharing it, encrypted end to end over
  <a href="https://www.iroh.computer/" rel="noreferrer">iroh</a>. Nothing is uploaded anywhere.
</footer>
<script type="module" src="page.js"></script>
</body>
</html>
