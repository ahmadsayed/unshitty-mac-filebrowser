<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Files</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <div class="window">

      <!-- ===== Sidebar (AdwNavigationSplitView sidebar) ===== -->
      <aside class="sidebar">
        <header class="sidebar-header" data-tauri-drag-region>
          <div class="traffic-light-spacer" data-tauri-drag-region></div>
          <button class="flat-btn" id="btn-search" title="Search (Cmd+F)" aria-label="Search"></button>
          <span class="sidebar-title" data-tauri-drag-region>Files</span>
          <button class="flat-btn" id="btn-main-menu" title="Main Menu" aria-label="Main Menu"></button>
        </header>
        <div class="sidebar-scroll">
          <nav id="sidebar-places" class="sidebar-section" aria-label="Places"></nav>
          <div class="sidebar-separator"></div>
          <nav id="sidebar-bookmarks" class="sidebar-section" aria-label="Bookmarks"></nav>
          <div class="sidebar-separator" id="sidebar-mounts-separator"></div>
          <nav id="sidebar-mounts" class="sidebar-section" aria-label="Devices"></nav>
        </div>
      </aside>

      <!-- ===== Content ===== -->
      <main class="content">
        <header class="headerbar" data-tauri-drag-region>
          <div class="hb-start">
            <button class="flat-btn" id="btn-back" title="Back (Alt+Left)" aria-label="Back" disabled></button>
            <button class="flat-btn" id="btn-forward" title="Forward (Alt+Right)" aria-label="Forward" disabled></button>
          </div>

          <div class="hb-center" data-tauri-drag-region>
            <!-- Path bar: breadcrumb, or an entry while editing (Cmd+L) -->
            <div class="pathbar" id="pathbar">
              <div class="pathbar-crumbs" id="crumbs"></div>
              <input class="pathbar-entry" id="path-entry" type="text" spellcheck="false" autocomplete="off" aria-label="Location" hidden />
            </div>
            <!-- Search entry replaces the path bar while searching -->
            <div class="searchbar" id="searchbar" hidden>
              <span class="searchbar-icon" id="search-icon"></span>
              <input class="searchbar-entry" id="search-entry" type="search" spellcheck="false" autocomplete="off" placeholder="Search" aria-label="Search" />
            </div>
          </div>

          <div class="hb-end">
            <button class="flat-btn" id="btn-location-menu" title="Current Folder Menu" aria-label="Current Folder Menu"></button>
            <button class="flat-btn" id="btn-new-folder" title="New Folder (Shift+Cmd+N)" aria-label="New Folder"></button>
            <div class="split-btn">
              <button class="flat-btn" id="btn-view-toggle" aria-label="Toggle View"></button>
              <button class="flat-btn split-btn-arrow" id="btn-view-menu" title="View Options" aria-label="View Options"></button>
            </div>
          </div>
        </header>

        <div class="view-overlay">
          <div class="view-scroll" id="view-scroll">
            <div class="view" id="view" tabindex="0" role="listbox" aria-multiselectable="true"></div>
          </div>
          <div class="rubberband" id="rubberband" hidden></div>
          <div class="floating-bar" id="floating-bar" hidden></div>
          <div class="toast-overlay" id="toast-overlay" aria-live="polite"></div>
        </div>
      </main>
    </div>
  </body>
</html>
