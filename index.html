<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>File Browser</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <!-- ===== App Shell (Nautilus-style) ===== -->
    <div class="app-shell">

      <!-- Left sidebar -->
      <aside class="sidebar">
        <div class="sidebar-header">Places</div>
        <nav id="sidebar-places" class="sidebar-places"></nav>
      </aside>

      <!-- Main content area -->
      <div class="main">

        <!-- Toolbar -->
        <div class="toolbar" id="toolbar">
          <!-- Navigation buttons placeholder (Task 4) -->
          <div class="toolbar-nav" id="toolbar-nav">
            <button class="toolbar-btn" id="btn-back" title="Go back" disabled>&#8592;</button>
            <button class="toolbar-btn" id="btn-forward" title="Go forward" disabled>&#8594;</button>
            <button class="toolbar-btn" id="btn-up" title="Go up" disabled>&#8593;</button>
          </div>

          <!-- Path breadcrumb -->
          <div class="toolbar-path">
            <span class="path-label" id="path-label"></span>
          </div>

          <!-- View mode toggle placeholder (Task 4) -->
          <div class="toolbar-actions" id="toolbar-actions">
            <button class="toolbar-btn" id="btn-view-list" title="List view">&#9776;</button>
            <button class="toolbar-btn" id="btn-view-icon" title="Icon view">&#9638;</button>
          </div>
        </div>

        <!-- File listing -->
        <div class="listing-container">
          <div id="listing" class="listing"></div>
        </div>

      </div>
    </div>
  </body>
</html>
